[project]
name = "ps1-invoice-processor"
version = "0.1.0"
description = "PS-1 invoice processing — from PDF to decision"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.33",
    "pandas>=2.0",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.2.3",
    "langgraph>=1.2.12",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "pydantic>=2.13.5",
    "langchain-openai>=1.6.3",
    "langchain-anthropic>=1.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
